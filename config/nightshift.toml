# config/nightshift.toml — every knob in one file (TechnicalPRD 6). Values are defaults.

[repo]
upstream       = "jaseci-labs/jac"          # renamed from jaseci-labs/jaseci
fork           = "ayushmk7/jaseci"          # <- set at M0
default_branch = "main"

[budgets]                                    # PRD 9 guardrails — no step may violate these
themes_per_night   = 6                       # was 3 -- real data: 85% of real findings were being
                                              # dropped for pure over-night-budget reasons while
                                              # verify_estimate_min sat at 3 (180min budget, huge
                                              # unused headroom). Revisit if a night's real
                                              # runtime/cost grows uncomfortable.
files_per_theme    = 10
loc_per_theme      = 600                     # was 300 -- was silently dropping confirmed, single-
                                              # file, high-confidence dead-code finds outright (a
                                              # real 492-line dead file never even got considered:
                                              # 0 + 492 > 300 killed it before packing tried).
wallclock_min      = 180                     # hard ceiling for the whole night
audit_timeout_min  = 20                      # 15 was too tight for the jac core package: 07-18 hit the wall twice, 0-byte envelope both times
apply_timeout_min  = 25                      # per theme session
audit_max_turns    = 45                      # audit is read-only investigation (grep/read heavy,
                                              # no edits); 25 was too tight once the prompt started
                                              # demanding real evidence per finding -- confirmed
                                              # live: a real audit hit terminal_reason=max_turns
max_turns          = 80                      # apply session cap; the real cost brake on a subscription
max_budget_usd     = 5                       # inert on subscription; belt if ever on an API key

[agent]
model         = "sonnet"                     # empty = account default, which silently drifts with
                                              # whatever the interactive session's default is at
                                              # 2am -- confirmed live, unnoticed model change between
                                              # two real runs. Pin explicitly; change here, not in code.
ponytail_mode = "full"                       # PRD 14-Q5

[protect]                                    # glob deny-list; enforced twice (prompt + S4 gate)
# release_notes/ is NOT listed: fragments live outside docs/ since the restructure, so they need
# no negation entry. The old "!docs/docs/community/release_notes/unreleased/**" was dead.
globs = [
  "**/tests/**", "**/fixtures/**", "**/*.test.jac",
  "**/jac.spec", "**/grammar/**", "**/generated/**", "**/vendor/**",
  "docs/**",
  ".github/**", "examples/**",
]

[email]
to        = "contactayushmadhav@gmail.com"
from      = "nightshift@localhost"
smtp_host = "smtp.gmail.com"
smtp_port = 465                              # SSL; creds live in ~/.nightshift.env, never here

[paths]                                      # absolute paths pinned at M0 (launchd PATH is minimal)
# TWO jac binaries: `jac` runs the harness's own Jac helpers (validated on 0.16.1);
# `jac_repo` is the target repo's dev binary (built by fresh_env.sh) used for the jaseci
# gates (jac check/test/format) and the agent sessions — it tracks the repo's version.
jac      = "/Users/ayush/.local/bin/jac"
jac_repo = "/Volumes/ExtremePro/JaseciLabs/NightShift/work/repo/jac/zig-out/bin/jac"
claude   = "/Users/ayush/.local/bin/claude"
gh       = "/opt/homebrew/bin/gh"
precommit = "/Users/ayush/.local/bin/pre-commit"
