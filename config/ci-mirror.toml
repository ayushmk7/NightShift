# config/ci-mirror.toml — local replica of the CI jobs a FORK PR cannot reach.
#
# Why this file exists: 13 of ~16 ci.yml jobs are `runs-on: blacksmith-4vcpu-ubuntu-2404`,
# third-party runners attached to the upstream org. Confirmed empirically on 2026-07-30 against
# ayushmk7/jaseci: ubuntu-latest/macos-latest jobs complete, every Blacksmith job sits `queued`
# indefinitely (one observed stuck 2h). The Blacksmith subset is exactly what matters for
# janitorial diffs, so fork CI is not a usable pre-PR gate and this replica is.
#
# ponytail: a hash tripwire, NOT a yaml interpreter. Parsing ci.yml at runtime to derive these
#           commands would be a parser to maintain forever; a hash mismatch that forces a human
#           to re-read the diff is three lines and cannot silently be wrong.

[source]
workflow = ".github/workflows/ci.yml"
sha256   = "3f282983240facf169e109c0eea9cab4fe971515d84d9980c2c3373224497fda"

[jobs.fmt]
ci_job = "jac-check"
# CI's EXACT invocation for a PULL REQUEST event (ci.yml:279-295, :326-345) -- NOT the `else`
# whole-repo sweep at ci.yml:350. Nightshift only ever opens PRs (never pushes to the default
# branch upstream), so `github.event_name == 'pull_request'` is always true for it, and ci.yml's
# own "Determine changed .jac files" step always takes the `mode=scoped` branch for it. The
# scoped step's `origin/${{ github.base_ref }}` merge-base is mirrored locally as
# `git merge-base "$NS_REPO_DEFAULT_BRANCH" HEAD` -- the local analogue of "the commit this PR
# would be based on". CORRECTED 2026-07-30 after a dry run against a clean `main` checkout showed
# rc=1 with 259 files flagged: that was this entry mistakenly registered as the whole-repo
# (`git ls-files`) variant, which is real CI's PUSH-event behavior only and would reject every
# candidate branch on repo-wide pre-existing drift it never touched -- confirmed against real
# upstream CI logs (a cross-repo PR's `jac-check` job log literally prints `mode=scoped` and then
# diffs only the PR's own changed .jac files). `jac format .` / `jac lint --fix` are NOT this
# tool: they were removed by CLI cleanup #7255. The exclusion regex is copied verbatim from the
# scoped branch (ci.yml:339); this branch does NOT have the whole-repo branch's extra
# `_syntax_err\.jac$` alternative, but that alternative was already redundant there -- every
# `_syntax_err.jac` filename also ends in `_err.jac`, so `_err\.jac$` alone matches it too. Preserves
# CI's exact "no formattable files changed -> skip cleanly, exit 0" behavior (ci.yml:333-343),
# collapsed into one check since an empty diff and an all-excluded diff both reduce to the same
# empty $FILES here. See [jobs.fmt_autofix] just below: SAME tool/flags/exclusion-regex, only the
# path SELECTION differs (diff-scoped here vs. tier-1's own jac/jaclang/byllm scope there) --
# bin/test-harness.sh's drift guard asserts the two regexes stay byte-identical.
#
# CORRECTED AGAIN 2026-07-30 (code review): `BASE="$(git merge-base ...)" | ... || true` used to
# wrap the WHOLE pipeline, INCLUDING the merge-base computation, in one `|| true`. That made a
# broken merge-base (bad/unset $NS_REPO_DEFAULT_BRANCH, detached HEAD with no shared history,
# etc.) collapse silently into an EMPTY $FILES -- indistinguishable from the legitimate "nothing
# changed" skip. Reproduced: `NS_REPO_DEFAULT_BRANCH=nosuchbranch` or an unset
# `NS_REPO_DEFAULT_BRANCH` both printed "No formattable .jac files changed; skipping format
# check." and returned rc=0 -- a hard-broken gate reporting green. ci.yml itself cannot do this:
# its own `BASE="$(git merge-base ...)"` (ci.yml:289) runs unguarded under `set -euo pipefail`, so
# a real CI job just fails outright. Fixed by computing BASE as its own statement with an explicit
# `|| { ...; exit 70; }` failure path -- `70` matches lib/common.sh's EX_BUG convention for "the
# harness itself is broken", not "the branch under test is unformatted" -- and scoping `|| true`
# to ONLY the `git diff | grep` pipeline that legitimately CAN be empty.
commands = [
  '''BASE="$(git merge-base "$NS_REPO_DEFAULT_BRANCH" HEAD 2>&1)" || { echo "ERROR: could not compute merge-base for jac fmt scoping: $BASE" >&2; exit 70; }; FILES="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.jac' | grep -vE '(/fixtures/|^scripts/|/passes/native/llvm/|_err\.jac$)' || true)"; if [ -z "$FILES" ]; then echo "No formattable .jac files changed; skipping format check."; else printf '%s\n' "$FILES" | tr '\n' '\0' | xargs -0 --no-run-if-empty jac fmt --check --lintfix; fi''',
]

[jobs.check]
ci_job = "jac-check"
# ci.yml:412-424, "Run jac check (using .jacignore)" -- has NO `continue-on-error`, unlike the fmt
# step above (:71 `continue-on-error: true`), so a real CI run fails the job immediately on a
# nonzero exit here; there is no separate "was it clean" gate to defer to. Task 4 originally
# measured only the `else` whole-repo branch (ci.yml:423, `jac check . --ignore ... --nowarn`) and
# recorded it RED and >1hr (see the now-superseded decision note that followed this file, deleted
# below) -- but that is the PUSH-event branch, and Nightshift only ever opens PRs, so the branch
# that actually gates it is the scoped one at ci.yml:421:
# `jac check $(cat changed-jac.txt) --ignore $IGNORE_ARGS --nowarn`. Measured directly: ~0.45s for
# one file, and RED on jac/jaclang/byllm/tool_protocol.jac specifically (3 errors, 45 warnings) --
# one of the 9 files [jobs.fmt_autofix] will reformat on a normal autofix night. Without this
# entry, tonight's fmt_autofix branch passes the mirror's fmt gate (formatting only) and then
# fails real CI on a pre-existing type error the fmt pass never touched.
#
# NOT a literal transcription of ci.yml:421, though -- code review 2026-07-30 found that CI's own
# form (`jac check $FILES --ignore $IGNORE_ARGS --nowarn`, IGNORE_ARGS = the 2 static globs plus
# every non-comment .jacignore line, ~570 total) is SILENTLY BROKEN on this host: `jac check`'s
# `--ignore` (argparse `nargs='*'`, following a required `nargs='+'` `paths`) reports a clean
# "0 collected" (exit 0) the moment it receives roughly 100-150 values, regardless of real errors
# in the files given -- reproduced with a bare `argparse.ArgumentParser` carrying the identical
# shape, confirming it is a CPython 3.14.5 argparse limitation (this host's Python), not a bug in
# jac's own CLI registration (jac/jaclang/cli/impl/registry.impl.jac is plain stdlib argparse).
# Binary-searched: 100 ignore values still worked, 120-150 did not. .jacignore alone is ~570
# lines, so ci.yml:421's literal form is a hard-broken false-green here -- the exact "gate reports
# green when it cannot tell" failure mode this review round exists to close, one command further
# in. Worked around by filtering the (always small, diff-scoped) candidate file list ourselves,
# in Jac (scripts/cimirror.jac's filter_survivors, a port of
# jaclang.jac0core.helpers.path_matches_exclude using Python's real fnmatch for semantic parity),
# THEN calling `jac check <survivors> --nowarn` with NO --ignore at all -- sidestepping the
# argparse limitation entirely rather than tripping over it more carefully.
#
# Same fail-loud merge-base handling as [jobs.fmt] above, for the identical reason.
commands = [
  '''BASE="$(git merge-base "$NS_REPO_DEFAULT_BRANCH" HEAD 2>&1)" || { echo "ERROR: could not compute merge-base for jac check scoping: $BASE" >&2; exit 70; }; FILES="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.jac')"; if [ -z "$FILES" ]; then echo "No .jac files changed; skipping jac check."; else SURVIVORS="$(printf '%s\n' "$FILES" | "$NS_PATHS_JAC" run "$NS_ROOT/scripts/cimirror.jac" filter-survivors .jacignore)"; if [ -z "$SURVIVORS" ]; then echo "All changed .jac files are ignore-listed; skipping jac check."; else printf '%s\n' "$SURVIVORS" | tr '\n' '\0' | xargs -0 --no-run-if-empty jac check --nowarn; fi; fi''',
]

[jobs.fmt_autofix]
# NOT a ci.yml job -- there is no upstream CI step this mirrors. This is tier-1's OWN apply step
# (lib/tier1.sh S2): the nightly "clean up drift, near-zero risk" autofix, deliberately scoped to
# jac/jaclang/byllm rather than the whole repo (repo-wide `--lintfix` would touch ~260 files
# nightly, drag the ~95min "jac" core test suite into every autofix night via
# gated_pkgs_from_diff, and rewrite files with known pre-existing .jacignore type-check gaps --
# see lib/tier1.sh's own comment). [jobs.fmt] and this entry MUST use the identical tool, flags
# (minus --check -- tier-1 APPLIES the fix, [jobs.fmt] only VERIFIES it), and exclusion regex;
# only the path SELECTION (git-ls-files pathspec here vs. git-diff-scoped there) differs. Kept as
# its own registry entry, not derived from [jobs.fmt] by string surgery: once [jobs.fmt] became
# diff-scoped it no longer contains a `git ls-files '*.jac'` pathspec to substitute, so a `sed`
# derivation has nothing to anchor on. bin/test-harness.sh's drift guard is the no-drift
# replacement for that substitution.
ci_job = "none -- tier-1's own apply step, not a ci.yml job"
commands = [
  "git ls-files -z 'jac/jaclang/byllm/*.jac' | grep -zv -E '(/fixtures/|^scripts/|/passes/native/llvm/|_err\\.jac$)' | xargs -0 --no-run-if-empty jac fmt --lintfix",
]

[jobs.jir]
ci_job = "jac-check"
# ci.yml:408-410. Deleting a symbol during a dead-code sweep can invalidate the generated
# registry, which CI verifies. Without this, dead-code PRs fail CI on a file the agent
# never touched.
commands = ["jac gen-jir-registry --verify"]

[jobs.byllm]
ci_job = "test-packages-and-docs"
# ci.yml:608, run from the repo root. Note ci.yml:946 runs the SAME tests serially
# (JAC_TEST_JOBS=0) in test-pypi-build because "byllm tests share a SQLite mock-LLM cache".
# We mirror the PR-path job (608) for fidelity; the flake that serialization exists to avoid is
# absorbed by the union-of-two-runs baseline instead (see scripts/testgate.jac record-union).
commands = ["jac test jac/jaclang/byllm/tests"]

[jobs.compiler]
ci_job = "test-compiler"
# The second command is the cross-backend equivalence suite. The harness has NEVER gated it:
# lib/verify.sh's pkg_test_raw ran only tests/ and tests/compiler.
commands = [
  "JAC_TEST_JOBS=auto jac test tests/compiler",
  "JAC_TEST_JOBS=auto jac test jaclang/compiler/tests",
]

[jobs.runtime]
ci_job = "test-runtime"
commands = ["JAC_TEST_JOBS=auto jac test tests/ --ignore tests/compiler"]

[jobs.contribution]
ci_job = "contribution-checks"
# ci.yml:449-512, five real gates (checkout + "Set up jac" are infra, not gates):
#   461-468 Block AI co-author attribution   470-479 Block Python files
#   482-497 Check bun version lockstep       499-500 Validate Jac code blocks in docs corpus
#   502-512 Check Release Notes Updated
#
# CORRECTED after code review 2026-07-30: the original commands list here
# ("scripts/check-release-notes.sh", "pre-commit run --all-files") was wrong on two counts.
# (1) `pre-commit run --all-files` is NOT part of this job at all -- pre-commit is run by the
#     separate third-party pre-commit.ci service. work/repo/.pre-commit-config.yaml's own header:
#     "Manifest for pre-commit.ci only ... Contributors do not install pre-commit locally ...
#     jac formatting in CI is enforced by the Contribution Checks workflow's `jac fmt --check`
#     gate." Its hooks are markdownlint-cli2 + an em-dash ban, nothing this job gates on. Removed.
# (2) The other three real gates in this job (AI co-author, no-Python-files, bun/zig lockstep,
#     docs-corpus validation) were simply missing. Added below, transcribed from ci.yml's actual
#     step bodies rather than re-guessed.
#
# AI co-author check: CI's exact command is
#   git log origin/${{ github.base_ref }}..HEAD --format='%b' | grep -iP '...'
# `github.base_ref` only exists for a real PR event. Locally there is no PR object, so this
# mirrors it as `git log $NS_REPO_DEFAULT_BRANCH..HEAD` -- the commits unique to the current
# branch vs the default branch, which is exactly what CI's `origin/base..HEAD` log range means
# for a PR opened against it. Nightshift IS an AI agent producing commits, so this is precisely
# the check most likely to bite one of its own PRs -- it stays a hard gate, not a nice-to-have.
#
# Block Python files: CI diffs `origin/${{ github.base_ref }}...HEAD` (triple-dot, i.e. relative
# to the merge-base). Mirrored the same way lib/verify.sh already diffs
# ("$NS_REPO_DEFAULT_BRANCH...HEAD") for consistency.
#
# EVAL NOTE for whoever builds the executor (Task 5/6): these command strings are `eval`ed in a
# subshell that already has the config env loaded (see lib/common.sh's ns_load_config /
# NS_REPO_DEFAULT_BRANCH, NS_PATHS_JAC, NS_ROOT), so `$NS_REPO_DEFAULT_BRANCH` and the leading
# `CI=true`-style env prefix on the fragment-check command below expand/apply correctly at eval
# time. Do NOT "sanitize" a bare `$VAR` or a leading `VAR=value` out of these strings -- both are
# intentional and load-bearing.
#
# `-P` -> `-E`: CI's runners are Linux/GNU grep, where `-P` (PCRE) works. This dev host's real
# /usr/bin/grep is BSD grep with NO PCRE support at all -- `grep -P` hard-errors
# ("invalid option -- P") the moment either command actually executes as a subprocess (verified:
# the interactive tool shell here has a `grep` shell FUNCTION shimming in a bundled PCRE-capable
# `ugrep`, but that function is not exported, so any `bash -c` child process -- which is how
# Task 5/6 will actually invoke these command strings -- falls through to the real BSD binary).
# `\b` word-boundaries are NOT a PCRE-only feature -- BSD grep supports them fine under `-E`, and
# GNU grep treats `\b` as a GNU extension valid under `-E` too, not exclusively `-P`. So `-E`
# reproduces CI's exact match semantics on Linux (verified: no lookaheads/backrefs in either
# pattern, nothing `-E` can't express) while also being what actually runs on this host. Verified
# directly (env -i PATH=/usr/bin:/bin, i.e. no shell shim): both patterns behave identically
# under `-iE`/`-E` here to their documented `-iP`/`-P` CI behavior.
#
# Check Release Notes Updated: CI's ACTUAL command is `bash scripts/check-release-notes.sh` with
# `env: CI: "true"` (ci.yml:502-512). That command CANNOT run on this host: the script's line
# 12 `declare -A FOLDER_TO_FRAGMENTS=(...)` needs bash 4+ associative arrays, and this harness's
# only available bash (both /bin/bash and whatever `env bash` resolves to) is 3.2.57. Under 3.2,
# `declare -A` is silently rejected and bash then mis-parses the parenthesized initializer as an
# INDEXED-array subscript, evaluating `["jac/jaclang/"]` arithmetically -- which references the
# unset variable `jac` under `set -u` and crashes ("line 12: jac: unbound variable")
# unconditionally, before the script's own CI/local branching ever runs. Adding the required
# `CI=true` alone does NOT fix this -- it still crashes -- so this is a DELIBERATE, DISCLOSED
# EQUIVALENT rather than the literal script: scripts/fragcheck.jac (in this harness's own
# scripts/, run under $NS_PATHS_JAC, never $NS_PATHS_JAC_REPO -- it is a Nightshift tool, not a
# repo-facing one) reimplements exactly the folder_changed/fragment_added rule from
# check-release-notes.sh:122-144 in Jac, using the harness's existing nslib.fragment_path mapping.
# It deliberately does NOT reimplement that script's PR-number-match check, its
# directly-edited-release-notes-file check, or its fragment-content-format check (see
# fragcheck.jac's own header for why each is out of scope). CI itself remains the authority on the
# real, complete rule; this is a local approximation for a pre-PR gate that would otherwise be
# unable to run at all on this host. Piped the same way CI's diff-derived file list would be:
# `git diff --name-only "$NS_REPO_DEFAULT_BRANCH...HEAD" | ...`.
commands = [
  "if git log $NS_REPO_DEFAULT_BRANCH..HEAD --format='%b' | grep -iE 'co-authored-by:.*\\b(claude|anthropic|openai|copilot|composer|cursor|gpt|gemini|ai|bot)\\b'; then echo \"AI co-author attribution found in commit messages. Remove Co-Authored-By lines referencing AI tools.\"; exit 1; fi",
  "if git diff --name-only --diff-filter=A $NS_REPO_DEFAULT_BRANCH...HEAD | grep -E '\\.py$'; then echo \"New Python (.py) files detected in this PR. This codebase does not allow adding Python files.\"; exit 1; fi",
  '''jac_ver=$(grep -oE 'glob BUN_VERSION = "[^"]+"' jac/jaclang/runtimelib/client/bun_installer.jac | grep -oE '"[^"]+"' | tr -d '"'); zig_ver=$(grep -oE 'const BUN_VERSION = "[^"]+"' jac/launcher/payload.zig | grep -oE '"[^"]+"' | tr -d '"'); if [ -z "$jac_ver" ] || [ -z "$zig_ver" ]; then echo "Could not read BUN_VERSION from both bun_installer.jac and payload.zig"; exit 1; fi; if [ "$jac_ver" != "$zig_ver" ]; then echo "BUN_VERSION mismatch: bun_installer.jac=$jac_ver vs payload.zig=$zig_ver"; exit 1; fi''',
  "jac run scripts/validate_docs_code.jac",
  "git diff --name-only \"$NS_REPO_DEFAULT_BRANCH...HEAD\" | \"$NS_PATHS_JAC\" run \"$NS_ROOT/scripts/fragcheck.jac\" check",
]

# Step 2b decision, CORRECTED 2026-07-30 (code review): the note that used to live here concluded
# "NOT added as [jobs.check]" after measuring ONLY the whole-repo `else` branch of ci.yml:412-424
# (`jac check . --ignore $IGNORE_ARGS --nowarn`, ci.yml:423) -- RED, 182 files failed within the
# first ~12% of a traversal killed after taking well over an hour's projected runtime. That
# measurement was real, but it measured the wrong branch: exactly like [jobs.fmt] above, this step
# ALSO branches on `steps.changes.outputs.mode`, and Nightshift's PRs always take the scoped
# branch (ci.yml:421: `jac check $(cat changed-jac.txt) --ignore $IGNORE_ARGS --nowarn`), never
# the whole-repo one. The scoped branch is fast (~0.45s for one file, measured) and is what a real
# PR is actually gated on -- so [jobs.check] above IS now part of the mirror. The whole-repo
# variant's RED verdict is real but no longer relevant to this decision: it was never the thing
# gating a Nightshift PR to begin with. (Aside from the earlier note also observed, and still
# true: several FAILED files there, e.g. jac/jaclang/byllm/cli.jac, are listed verbatim in
# .jacignore yet still failed under `jac check .`, meaning whole-repo `--ignore` does not fully
# suppress them the way ci.yml's comment implies -- worth a closer look some day, but irrelevant
# to [jobs.check]'s scoped invocation, which does not exercise that path.)
