# config/ci-mirror.toml — local replica of the CI jobs a FORK PR cannot reach.
#
# Why this file exists: 13 of ~16 ci.yml jobs are `runs-on: blacksmith-4vcpu-ubuntu-2404`,
# third-party runners attached to the upstream org. Confirmed empirically on 2026-07-30 against
# ayushmk7/jaseci: ubuntu-latest/macos-latest jobs complete, every Blacksmith job sits `queued`
# indefinitely (one observed stuck 2h). The Blacksmith subset is exactly what matters for
# janitorial diffs, so fork CI is not a usable pre-PR gate and this replica is.
#
# ponytail: a hash tripwire, NOT a yaml interpreter. Parsing ci.yml at runtime to derive these
#           commands would be a parser to maintain forever; a hash mismatch that forces a human
#           to re-read the diff is three lines and cannot silently be wrong.

[source]
workflow = ".github/workflows/ci.yml"
sha256   = "3f282983240facf169e109c0eea9cab4fe971515d84d9980c2c3373224497fda"

[jobs.fmt]
ci_job = "jac-check"
# CI's EXACT invocation for a PULL REQUEST event (ci.yml:279-295, :326-345) -- NOT the `else`
# whole-repo sweep at ci.yml:350. Nightshift only ever opens PRs (never pushes to the default
# branch upstream), so `github.event_name == 'pull_request'` is always true for it, and ci.yml's
# own "Determine changed .jac files" step always takes the `mode=scoped` branch for it. The
# scoped step's `origin/${{ github.base_ref }}` merge-base is mirrored locally as
# `git merge-base "$NS_REPO_DEFAULT_BRANCH" HEAD` -- the local analogue of "the commit this PR
# would be based on". CORRECTED 2026-07-30 after a dry run against a clean `main` checkout showed
# rc=1 with 259 files flagged: that was this entry mistakenly registered as the whole-repo
# (`git ls-files`) variant, which is real CI's PUSH-event behavior only and would reject every
# candidate branch on repo-wide pre-existing drift it never touched -- confirmed against real
# upstream CI logs (a cross-repo PR's `jac-check` job log literally prints `mode=scoped` and then
# diffs only the PR's own changed .jac files). `jac format .` / `jac lint --fix` are NOT this
# tool: they were removed by CLI cleanup #7255. The exclusion regex is copied verbatim from the
# scoped branch (ci.yml:339); this branch does NOT have the whole-repo branch's extra
# `_syntax_err\.jac$` alternative, but that alternative was already redundant there -- every
# `_syntax_err.jac` filename also ends in `_err.jac`, so `_err\.jac$` alone matches it too. Preserves
# CI's exact "no formattable files changed -> skip cleanly, exit 0" behavior (ci.yml:333-343),
# collapsed into one check since an empty diff and an all-excluded diff both reduce to the same
# empty $FILES here. This is now the ONLY fmt entry: tier-1's apply counterpart was retired with the
# stage, so nothing here can rewrite the branch it is judging (pinned by test-harness.sh section 6).
#
# CORRECTED AGAIN 2026-07-30 (code review): `BASE="$(git merge-base ...)" | ... || true` used to
# wrap the WHOLE pipeline, INCLUDING the merge-base computation, in one `|| true`. That made a
# broken merge-base (bad/unset $NS_REPO_DEFAULT_BRANCH, detached HEAD with no shared history,
# etc.) collapse silently into an EMPTY $FILES -- indistinguishable from the legitimate "nothing
# changed" skip. Reproduced: `NS_REPO_DEFAULT_BRANCH=nosuchbranch` or an unset
# `NS_REPO_DEFAULT_BRANCH` both printed "No formattable .jac files changed; skipping format
# check." and returned rc=0 -- a hard-broken gate reporting green. ci.yml itself cannot do this:
# its own `BASE="$(git merge-base ...)"` (ci.yml:289) runs unguarded under `set -euo pipefail`, so
# a real CI job just fails outright. Fixed by computing BASE as its own statement with an explicit
# `|| { ...; exit 70; }` failure path -- `70` matches lib/common.sh's EX_BUG convention for "the
# harness itself is broken", not "the branch under test is unformatted" -- and scoping `|| true`
# to ONLY the `git diff | grep` pipeline that legitimately CAN be empty.
commands = [
  '''BASE="$(git merge-base "$NS_REPO_DEFAULT_BRANCH" HEAD 2>&1)" || { echo "ERROR: could not compute merge-base for jac fmt scoping: $BASE" >&2; exit 70; }; FILES="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.jac' | grep -vE '(/fixtures/|^scripts/|/passes/native/llvm/|_err\.jac$)' || true)"; if [ -z "$FILES" ]; then echo "No formattable .jac files changed; skipping format check."; else printf '%s\n' "$FILES" | tr '\n' '\0' | xargs -0 --no-run-if-empty jac fmt --check --lintfix; fi''',
]

[jobs.check]
ci_job = "jac-check"
# ci.yml:412-424, "Run jac check (using .jacignore)" -- has NO `continue-on-error`, unlike the fmt
# step above (:71 `continue-on-error: true`), so a real CI run fails the job immediately on a
# nonzero exit here; there is no separate "was it clean" gate to defer to. Task 4 originally
# measured only the `else` whole-repo branch (ci.yml:423, `jac check . --ignore ... --nowarn`) and
# recorded it RED and >1hr (see the now-superseded decision note that followed this file, deleted
# below) -- but that is the PUSH-event branch, and Nightshift only ever opens PRs, so the branch
# that actually gates it is the scoped one at ci.yml:421:
# `jac check $(cat changed-jac.txt) --ignore $IGNORE_ARGS --nowarn`.
#
# This IS a literal transcription of ci.yml:421 (IGNORE_ARGS built exactly as ci.yml:415, passed
# unquoted to `--ignore` exactly as CI does). A code-review round on 2026-07-30 briefly replaced
# this with a Jac-side pre-filter (scripts/cimirror.jac's since-deleted filter_survivors),
# diagnosing `jac check --ignore`'s ~570-value .jacignore list as silently broken past ~100-150
# values under this host's Python 3.14.5 argparse. CORRECTED the same day: the diagnosis was
# wrong. A second reviewer reproduced the identical argparse shape at 10/100/120/150/300/570/2000
# values -- correct every time -- then ran this exact literal command with the real 573-token
# IGNORE_ARGS against a throwaway file with a genuine error and got the correct result (rc=1).
# What the binary search actually found: .jacignore's non-comment entry 116 IS
# `jac/jaclang/byllm/tool_protocol.jac` (the file used as the test probe) -- feeding the first 100
# entries left it un-ignored (correctly caught, "worked"); feeding 150 made it ignore-listed
# ("0 collected" was CI's real, correct behavior for an ignored file, not a bug). The 100-vs-150
# threshold was an artifact of the probe file's position in .jacignore, not of argv count.
# Worse, the pre-filter was ACTIVELY WRONG in the other direction: `--ignore` in `jac check` has
# two consumers, not one -- `_iter_jac_files` (input selection) AND `filter_issues`
# (analysis.impl.jac:125-133), which drops diagnostics whose OWN i.loc.mod_path is ignore-matched.
# A base file with an ignored `.impl.jac` annex (e.g. cli/commands/build.jac, whose errors are all
# attributed to cli/commands/impl/build.impl.jac, .jacignore line 176 -- at least 10 such
# non-ignored-base/ignored-annex pairs exist) passes real CI (`1 passed`) but would have been
# reported RED by a file-list-only pre-filter that never re-checked diagnostic provenance. That is
# the strict-direction failure that would have made this gate reject branches real CI accepts --
# worse than the false-green it was trying to fix. Reverted in full; kept only the fail-loud
# merge-base handling below, which was a real, independent fix.
commands = [
  '''BASE="$(git merge-base "$NS_REPO_DEFAULT_BRANCH" HEAD 2>&1)" || { echo "ERROR: could not compute merge-base for jac check scoping: $BASE" >&2; exit 70; }; FILES="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.jac')"; if [ -z "$FILES" ]; then echo "No .jac files changed; skipping jac check."; else IGNORE_ARGS="tests checker_*.jac *_err.jac $(grep -v '^#' .jacignore | grep -v '^[[:space:]]*$' | tr '\n' ' ')"; jac check $FILES --ignore $IGNORE_ARGS --nowarn; fi''',
]

# [jobs.fmt_autofix] was deleted 2026-07-30 with tier-1 (the S2 deterministic autofix stage). It was
# the only APPLY entry in this file -- everything here now VERIFIES and never mutates the tree, which
# is why bin/test-harness.sh can assert that no gate job carries `jac fmt --lintfix` without --check.
# Formatting is now each theme's own responsibility: the apply session has Bash(jac fmt *) and
# [jobs.fmt] gates the result diff-scoped, exactly as CI does on a PR.

[jobs.jir]
ci_job = "jac-check"
# ci.yml:408-410. Deleting a symbol during a dead-code sweep can invalidate the generated
# registry, which CI verifies. Without this, dead-code PRs fail CI on a file the agent
# never touched.
commands = ["jac gen-jir-registry --verify"]

[jobs.byllm]
ci_job = "test-packages-and-docs"
# ci.yml:608, run from the repo root. Note ci.yml:946 runs the SAME tests serially
# (JAC_TEST_JOBS=0) in test-pypi-build because "byllm tests share a SQLite mock-LLM cache".
# We mirror the PR-path job (608) for fidelity; the flake that serialization exists to avoid is
# absorbed by the union-of-two-runs baseline instead (see scripts/testgate.jac record-union).
#
# No `cd` prefix here, unlike [jobs.compiler]/[jobs.runtime]: test-packages-and-docs declares no
# `working-directory`, so ci.yml runs this from the repo ROOT, which is where cimirror_job already
# runs it. Verified 2026-07-30: 219 items collected from the root.
#
# The FIRST command is ci.yml:598-603's dependency install, and it is not optional here. Those four
# packages live in the jac GLOBAL env at
# $HOME/.cache/jac/rt/<hash>/python/lib/python3.14/site-packages, which is HOME-derived -- so
# cimirror_job's clean $LOG_DIR/mirror-home strips them. Measured 2026-07-30, same command, same
# cwd, only HOME differing:
#   real HOME  (litellm 1.82.6, pillow 12.3.0, httpx 0.28.1, loguru 0.7.3 present, anyio plugin
#              loaded):  219 items collected -> 3 failed, 215 passed, 1 skipped
#   clean HOME (all four absent, no anyio plugin): 105 items collected -> 5 failed, 100 passed,
#              plus three `agent error: No module named 'httpx'` lines
# The 114 missing tests vanish from COLLECTION with no collection-error line, because
# jac/jaclang/byllm/_optdeps/{litellm,pillow,loguru}.jac are SOFT-IMPORT shims exporting
# HAS_LITELLM / HAS_LOGURU and llm.impl/model.impl.jac:25 branches on them -- a missing dependency
# silently removes tests rather than raising. So testgate.jac would have seen a shorter list of
# ids, never an error.
#
# Why this could not be deferred as "registry breadth": gated_suites_from_diff routes a byllm
# change to the byllm suite ONLY, so nothing backstops it. (It was more urgent still when tier-1
# existed, since its nightly unattended autofix was scoped to exactly this directory.) Paid once per night's
# mirror-home, not per job or per branch.
#
# Two things from the same ci.yml job are deliberately NOT transcribed, both checked rather than
# assumed:
#   ci.yml:605 `TEST_ENV=true` is VESTIGIAL -- `grep -rn TEST_ENV` across the whole checkout hits
#     only ci.yml:563 and :605. Nothing reads it. Adding it would be cargo cult.
#   ci.yml:610-611's docs-corpus step (jac/tests/cli/test_docs_content.jac, test_guide_docs.jac) is
#     ALREADY COVERED: both files live under jac/tests/, which [jobs.runtime] collects wholesale.
#     Duplicating them here would just run them twice.
commands = [
  'jac install "litellm>=1.70.0,<=1.82.6" "pillow>=12.0.0,<13.0.0" "httpx>=0.27.0" "loguru>=0.7.2,<0.8.0" --global',
  "jac test jac/jaclang/byllm/tests",
]

[jobs.compiler]
ci_job = "test-compiler"
# The second command is the cross-backend equivalence suite. The harness had NEVER gated it before
# Task 6: lib/verify.sh's since-replaced pkg_test_raw ran only tests/ and tests/compiler.
#
# `cd jac && ` IS REQUIRED AND LOAD-BEARING -- do not "simplify" it away. Both ci.yml steps that
# these mirror (:181-193, :195-214) declare `working-directory: jac` (:182, :196), so their paths are relative
# to $REPO/jac, NOT to the repo root. lib/cimirror.sh's cimirror_job evals every command from
# `cd "$REPO"` (the root), which is correct for every OTHER job here (jac-check, contribution-checks
# and test-packages-and-docs all run at the root in ci.yml) but wrong for these two and for
# [jobs.runtime] below.
#
# Measured 2026-07-30, from the repo root: `jac test tests/compiler` ->
# "Error: File not found: 'tests/compiler'", rc=1, ZERO tests collected. Same for
# `jaclang/compiler/tests` and for [jobs.runtime]'s command -- neither `tests/` nor `jaclang/` exists
# at the root. With `cd jac` first: 2612 items, 180 items, and 1852 items collected respectively.
# So 4644 tests were silently not running. Because the runner emits no FAILED/ERROR lines when it
# never starts, testgate.jac's failing_ids() parsed an EMPTY set from that capture -- identical to a
# perfectly green run -- so `nightshift.sh baseline` would have recorded count:0 for both suites and
# every candidate branch afterwards would have "passed" a test gate that executed nothing. Exactly
# the silent-false-green class this whole mirror exists to prevent.
#
# Implemented as a `cd` inside the command string rather than a new per-job `workdir` key because
# cimirror_job already evals each command in its own subshell -- so the `cd` cannot leak into the
# next command (which is also why BOTH commands below need their own) -- and `&&` makes a failed
# `cd` return nonzero, i.e. the job fails loudly instead of running the suite in the wrong place.
# lib/verify.sh's assert_suite_ran is the belt to this braces, on BOTH the baseline and the branch
# path: it refuses to let a capture with the wrong number of runner sessions be scored at all, so a
# regression here fails loudly instead of silently passing every branch.
# `JAC_NO_DEV_SOURCE=""` on the SECOND command only, mirroring ci.yml:202-203's step-level `env:`.
# ci.yml:196-201 explains why: the equivalence suite's cross-module tests build fixture paths under
# jac/tests/ from jaclang.__file__, which only resolve in the CHECKOUT, not in the binary's bundled
# site copy -- so that one step is deliberately forced back through the checkout's
# `[dev] jaclang_source` loop. Harmless on this host today (the repo binary already reports
# "jac dev mode -- using compiler source at work/repo/jac"), but a human shell that happened to
# export JAC_NO_DEV_SOURCE=1 would otherwise silently compile this suite against the site copy and
# fail on unresolvable fixtures. Explicit beats inherited.
#
# NOT transcribed from these two ci.yml jobs, recorded so nobody has to rediscover it: the
# `zig build -Dno-ninja vendor-musl` step (ci.yml:174-179, :242-247) and test-runtime's Node/Bun
# setup (:236-241). Whatever those enable is simply absent locally, so any test depending on them
# fails identically on main and on the branch -- it lands in the baseline and is subtracted out.
# That makes the local gate PERMISSIVE on those tests, never falsely red; real CI remains the
# authority. Worth revisiting only if the baseline turns out to be dominated by them.
commands = [
  "cd jac && JAC_TEST_JOBS=auto jac test tests/compiler",
  'cd jac && JAC_NO_DEV_SOURCE="" JAC_TEST_JOBS=auto jac test jaclang/compiler/tests',
]

[jobs.runtime]
ci_job = "test-runtime"
# `cd jac && ` for the same reason as [jobs.compiler] above: ci.yml:250-263 declares
# `working-directory: jac` (:251). From the repo root this command collected zero tests and reported
# "File not found: 'tests/'"; from jac/ it collects 1852.
commands = ["cd jac && JAC_TEST_JOBS=auto jac test tests/ --ignore tests/compiler"]

[jobs.contribution]
ci_job = "contribution-checks"
# ci.yml:449-512, five real gates (checkout + "Set up jac" are infra, not gates):
#   461-468 Block AI co-author attribution   470-479 Block Python files
#   482-497 Check bun version lockstep       499-500 Validate Jac code blocks in docs corpus
#   502-512 Check Release Notes Updated
#
# CORRECTED after code review 2026-07-30: the original commands list here
# ("scripts/check-release-notes.sh", "pre-commit run --all-files") was wrong on two counts.
# (1) `pre-commit run --all-files` is NOT part of this job at all -- pre-commit is run by the
#     separate third-party pre-commit.ci service. work/repo/.pre-commit-config.yaml's own header:
#     "Manifest for pre-commit.ci only ... Contributors do not install pre-commit locally ...
#     jac formatting in CI is enforced by the Contribution Checks workflow's `jac fmt --check`
#     gate." Its hooks are markdownlint-cli2 + an em-dash ban, nothing this job gates on. Removed.
# (2) The other three real gates in this job (AI co-author, no-Python-files, bun/zig lockstep,
#     docs-corpus validation) were simply missing. Added below, transcribed from ci.yml's actual
#     step bodies rather than re-guessed.
#
# AI co-author check: CI's exact command is
#   git log origin/${{ github.base_ref }}..HEAD --format='%b' | grep -iP '...'
# `github.base_ref` only exists for a real PR event. Locally there is no PR object, so this
# mirrors it as `git log $NS_REPO_DEFAULT_BRANCH..HEAD` -- the commits unique to the current
# branch vs the default branch, which is exactly what CI's `origin/base..HEAD` log range means
# for a PR opened against it. Nightshift IS an AI agent producing commits, so this is precisely
# the check most likely to bite one of its own PRs -- it stays a hard gate, not a nice-to-have.
#
# Block Python files: CI diffs `origin/${{ github.base_ref }}...HEAD` (triple-dot, i.e. relative
# to the merge-base). Mirrored the same way lib/verify.sh already diffs
# ("$NS_REPO_DEFAULT_BRANCH...HEAD") for consistency.
#
# EVAL NOTE for whoever builds the executor (Task 5/6): these command strings are `eval`ed in a
# subshell that already has the config env loaded (see lib/common.sh's ns_load_config /
# NS_REPO_DEFAULT_BRANCH, NS_PATHS_JAC, NS_ROOT), so `$NS_REPO_DEFAULT_BRANCH` and the leading
# `CI=true`-style env prefix on the fragment-check command below expand/apply correctly at eval
# time. Do NOT "sanitize" a bare `$VAR` or a leading `VAR=value` out of these strings -- both are
# intentional and load-bearing.
#
# `-P` -> `-E`: CI's runners are Linux/GNU grep, where `-P` (PCRE) works. This dev host's real
# /usr/bin/grep is BSD grep with NO PCRE support at all -- `grep -P` hard-errors
# ("invalid option -- P") the moment either command actually executes as a subprocess (verified:
# the interactive tool shell here has a `grep` shell FUNCTION shimming in a bundled PCRE-capable
# `ugrep`, but that function is not exported, so any `bash -c` child process -- which is how
# Task 5/6 will actually invoke these command strings -- falls through to the real BSD binary).
# `\b` word-boundaries are NOT a PCRE-only feature -- BSD grep supports them fine under `-E`, and
# GNU grep treats `\b` as a GNU extension valid under `-E` too, not exclusively `-P`. So `-E`
# reproduces CI's exact match semantics on Linux (verified: no lookaheads/backrefs in either
# pattern, nothing `-E` can't express) while also being what actually runs on this host. Verified
# directly (env -i PATH=/usr/bin:/bin, i.e. no shell shim): both patterns behave identically
# under `-iE`/`-E` here to their documented `-iP`/`-P` CI behavior.
#
# Check Release Notes Updated: CI's ACTUAL command is `bash scripts/check-release-notes.sh` with
# `env: CI: "true"` (ci.yml:502-512). That command CANNOT run on this host: the script's line
# 12 `declare -A FOLDER_TO_FRAGMENTS=(...)` needs bash 4+ associative arrays, and this harness's
# only available bash (both /bin/bash and whatever `env bash` resolves to) is 3.2.57. Under 3.2,
# `declare -A` is silently rejected and bash then mis-parses the parenthesized initializer as an
# INDEXED-array subscript, evaluating `["jac/jaclang/"]` arithmetically -- which references the
# unset variable `jac` under `set -u` and crashes ("line 12: jac: unbound variable")
# unconditionally, before the script's own CI/local branching ever runs. Adding the required
# `CI=true` alone does NOT fix this -- it still crashes -- so this is a DELIBERATE, DISCLOSED
# EQUIVALENT rather than the literal script: scripts/fragcheck.jac (in this harness's own
# scripts/, run under $NS_PATHS_JAC, never $NS_PATHS_JAC_REPO -- it is a Nightshift tool, not a
# repo-facing one) reimplements exactly the folder_changed/fragment_added rule from
# check-release-notes.sh:122-144 in Jac, using the harness's existing nslib.fragment_path mapping.
# It deliberately does NOT reimplement that script's PR-number-match check, its
# directly-edited-release-notes-file check, or its fragment-content-format check (see
# fragcheck.jac's own header for why each is out of scope). CI itself remains the authority on the
# real, complete rule; this is a local approximation for a pre-PR gate that would otherwise be
# unable to run at all on this host. Piped the same way CI's diff-derived file list would be:
# `git diff --name-only "$NS_REPO_DEFAULT_BRANCH...HEAD" | ...`.
#
# CORRECTED 2026-07-30 (code review): the first two commands used to be written as
# `if git ... | grep ...; then fail; fi` with the git command INSIDE the `if` condition's pipeline.
# Both then reported CLEAN whenever the git command itself failed. Under the inherited
# `set -o pipefail` (bin/nightshift.sh:3, which cimirror_job's `( ... eval ... )` subshell
# inherits) a pipeline's status is that of the rightmost failing command -- grep's 1-on-no-match --
# so `git log nosuchbranch..HEAD` exiting 128 still left the `if` FALSE and the check silently
# passed. Same shape as [jobs.fmt]/[jobs.check]'s merge-base hole, which got explicit `exit 70`
# guards for exactly this reason; these two were missed in that round. Now each git command is its
# own statement with `|| { echo ...; exit 70; }`, and only the grep -- which legitimately exits 1
# when there is nothing to find -- stays in the `if`.
commands = [
  '''NS_AI_LOG="$(git log $NS_REPO_DEFAULT_BRANCH..HEAD --format='%b' 2>&1)" || { echo "ERROR: could not read the commit range $NS_REPO_DEFAULT_BRANCH..HEAD for the AI co-author check: $NS_AI_LOG" >&2; exit 70; }; if printf '%s\n' "$NS_AI_LOG" | grep -iE 'co-authored-by:.*\b(claude|anthropic|openai|copilot|composer|cursor|gpt|gemini|ai|bot)\b'; then echo "AI co-author attribution found in commit messages. Remove Co-Authored-By lines referencing AI tools."; exit 1; fi''',
  '''NS_ADDED="$(git diff --name-only --diff-filter=A $NS_REPO_DEFAULT_BRANCH...HEAD 2>&1)" || { echo "ERROR: could not diff $NS_REPO_DEFAULT_BRANCH...HEAD for the added-Python-files check: $NS_ADDED" >&2; exit 70; }; if printf '%s\n' "$NS_ADDED" | grep -E '\.py$'; then echo "New Python (.py) files detected in this PR. This codebase does not allow adding Python files."; exit 1; fi''',
  '''jac_ver=$(grep -oE 'glob BUN_VERSION = "[^"]+"' jac/jaclang/runtimelib/client/bun_installer.jac | grep -oE '"[^"]+"' | tr -d '"'); zig_ver=$(grep -oE 'const BUN_VERSION = "[^"]+"' jac/launcher/payload.zig | grep -oE '"[^"]+"' | tr -d '"'); if [ -z "$jac_ver" ] || [ -z "$zig_ver" ]; then echo "Could not read BUN_VERSION from both bun_installer.jac and payload.zig"; exit 1; fi; if [ "$jac_ver" != "$zig_ver" ]; then echo "BUN_VERSION mismatch: bun_installer.jac=$jac_ver vs payload.zig=$zig_ver"; exit 1; fi''',
  "jac run scripts/validate_docs_code.jac",
  "git diff --name-only \"$NS_REPO_DEFAULT_BRANCH...HEAD\" | \"$NS_PATHS_JAC\" run \"$NS_ROOT/scripts/fragcheck.jac\" check",
]

# build-jac decision, recorded 2026-07-30 (code review): NOT mirrored, deliberately, even though
# the design spec's mirror table (spec section 7) names it. ci.yml:61-143 is a Zig BUILD job -- zig
# build + fetch-typeshed, an `ldd`/`env -i` hermeticity smoke, two end-to-end `jac run` programs and
# a three-test `jac test` smoke file -- all of which exercise the COMPILED BINARY, not the tree a
# Nightshift diff touches. Measured against this checkout: `git ls-files '*.zig'` returns ELEVEN
# tracked files repo-wide (build.zig, launcher/*.zig, one example, one test fixture), none of them
# in any [shards.paths] entry, and every janitorial diff this harness produces is `.jac`. So a
# Nightshift branch cannot change what build-jac builds, and mirroring it would re-run a full Zig
# build (the single most expensive job in ci.yml) once per queued branch to re-prove a property no
# branch altered. The gate already runs against $NS_PATHS_JAC_REPO -- a binary built from this same
# checkout -- so a genuinely broken build makes every other mirrored job fail loudly anyway.
# REVISIT IF: a shard ever covers jac/launcher/ or jac/build.zig, or the agent's allow-list gains a
# tool that can edit them. Today neither is true.
#
# Step 2b decision, CORRECTED 2026-07-30 (code review): the note that used to live here concluded
# "NOT added as [jobs.check]" after measuring ONLY the whole-repo `else` branch of ci.yml:412-424
# (`jac check . --ignore $IGNORE_ARGS --nowarn`, ci.yml:423) -- RED, 182 files failed within the
# first ~12% of a traversal killed after taking well over an hour's projected runtime. That
# measurement was real, but it measured the wrong branch: exactly like [jobs.fmt] above, this step
# ALSO branches on `steps.changes.outputs.mode`, and Nightshift's PRs always take the scoped
# branch (ci.yml:421: `jac check $(cat changed-jac.txt) --ignore $IGNORE_ARGS --nowarn`), never
# the whole-repo one. The scoped branch is fast (~0.45s for one file, measured) and is what a real
# PR is actually gated on -- so [jobs.check] above IS now part of the mirror. The whole-repo
# variant's RED verdict is real but no longer relevant to this decision: it was never the thing
# gating a Nightshift PR to begin with. (Aside from the earlier note also observed, and still
# true: several FAILED files there, e.g. jac/jaclang/byllm/cli.jac, are listed verbatim in
# .jacignore yet still failed under `jac check .`, meaning whole-repo `--ignore` does not fully
# suppress them the way ci.yml's comment implies -- worth a closer look some day, but irrelevant
# to [jobs.check]'s scoped invocation, which does not exercise that path.)
